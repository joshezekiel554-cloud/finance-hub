# /etc/nginx/sites-available/holdorders.feldart.com
#
# Hold Orders — served by the SAME finance-hub Fastify process (port 3001),
# selected by Host: the app serves dist/web/holds.html for page loads on this
# host (HOLDORDERS_HOST, default holdorders.feldart.com). No separate pm2 app.
#
#   sudo ln -s /etc/nginx/sites-available/holdorders.feldart.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d holdorders.feldart.com
#
# Env on the box (.env.production): HOLDORDERS_HOST, HOLDORDERS_EMAILS,
# INBOX_HOLD_RESOLVE_URL — then `npx dotenv-cli -e .env.production -- pm2
# reload finance-hub --update-env`.
#
# Deliberately NO X-Frame-Options here: the hub (hub.feldart.com) frames this
# app; the app's own `Content-Security-Policy: frame-ancestors 'self'
# <HUB_PARENT_ORIGIN>` (src/server/server.ts) is the framing control.

server {
    listen 80;
    listen [::]:80;
    server_name holdorders.feldart.com;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2M;

    # Service-only, never public (same as finance's vhost).
    location /api/ext {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
